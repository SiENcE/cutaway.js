<!doctype html>
<!-- The game's connections (tools/graph.mjs writes the data): the puzzle dependency chart and the state
     budget. Opens from file://: graph.html?data=<the data file's URL> (default graph-data.js beside it). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cutaway: connections</title>
<style>
  :root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422; --line: #383835;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8a897f;
    --accent: #3987e5; --critical: #d03b3b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #6f6e66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface-0); color: var(--text-primary); font: 13px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 14px; background: var(--surface-1); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .meta { color: var(--text-secondary); }
  .tabs { display: flex; gap: 2px; margin-left: auto; }
  .tabs button { background: none; border: 1px solid var(--line); color: var(--text-secondary); padding: 4px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
  .tabs button.on { background: var(--surface-2); color: var(--text-primary); border-color: var(--text-muted); }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  main.budget { grid-template-columns: 1fr; }
  #canvas { position: relative; overflow: hidden; background: var(--surface-1); cursor: grab; }
  #canvas.drag { cursor: grabbing; }
  #canvas svg { width: 100%; height: 100%; display: block; }
  aside { border-left: 1px solid var(--line); background: var(--surface-1); overflow: auto; padding: 12px 14px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 16px 0 6px; font-weight: 600; }
  aside h2:first-child { margin-top: 0; }
  label.check { display: flex; gap: 6px; align-items: baseline; color: var(--text-secondary); margin: 3px 0; cursor: pointer; }
  input[type=search] { width: 100%; background: var(--surface-0); color: var(--text-primary); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; color: var(--text-secondary); background: none; font: inherit; font-size: 12px; }
  .chip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .chip.off { opacity: .4; }
  #detail .k { color: var(--text-muted); }
  #detail ul { margin: 2px 0 8px; padding-left: 16px; }
  #detail li { margin: 1px 0; cursor: pointer; }
  #detail li:hover { color: var(--accent); }
  #detail .share { color: var(--text-muted); font-size: 11px; }
  .hint { color: var(--text-muted); font-size: 12px; }
  .node text { font: 11px ui-monospace, Consolas, monospace; fill: var(--text-primary); pointer-events: none; }
  .node .room { fill: var(--text-muted); font-size: 9px; }
  .node { cursor: pointer; }
  .dim { opacity: .14; }
  .edge { fill: none; stroke-width: 1.2; }
  #tip { position: fixed; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-size: 12px; max-width: 420px; display: none; z-index: 5; }
  #budget { overflow: auto; padding: 18px 24px; background: var(--surface-1); }
  #budget p { color: var(--text-secondary); max-width: 760px; margin: 0 0 12px; }
  #budget .row { display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 10px; height: 22px; }
  #budget .row:hover { background: var(--surface-2); }
  #budget .name { font: 12px ui-monospace, Consolas, monospace; color: var(--text-primary); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #budget .track { position: relative; height: 14px; }
  #budget .bar { position: absolute; left: 0; top: 0; height: 14px; background: var(--accent); border-radius: 0 4px 4px 0; }
  #budget .val { position: absolute; top: -1px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
  #budget .axis { display: grid; grid-template-columns: 300px 1fr; gap: 10px; color: var(--text-muted); font-size: 11px; margin-top: 4px; }
  #budget .axis div { position: relative; height: 16px; border-top: 1px solid var(--line); }
  #budget .axis span { position: absolute; transform: translateX(-50%); top: 2px; }
  #budget .grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
</style>
</head>
<body>
<header>
  <h1>Connections</h1><span class="meta" id="meta">loading…</span>
  <div class="tabs"><button id="tab-deps" class="on">Dependencies</button><button id="tab-budget">State budget</button></div>
</header>
<main id="main">
  <div id="canvas"><svg id="svg"><defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
  </defs><g id="view"></g></svg></div>
  <aside id="side">
    <h2>Find</h2>
    <input type="search" id="find" placeholder="a fact, a move, a room">
    <h2>Show</h2>
    <label class="check"><input type="checkbox" id="opt-way"> only what the winning way needs</label>
    <label class="check"><input type="checkbox" id="opt-unused"> facts nothing needs</label>
    <label class="check"><input type="checkbox" id="opt-neg"> conditions on absence (“not yet …”)</label>
    <label class="check"><input type="checkbox" id="opt-partial"> facts read only sometimes</label>
    <label class="check"><input type="checkbox" id="opt-clock"> the clock (time, day) and its steps</label>
    <h2>Rooms</h2>
    <div class="chips" id="rooms"></div>
    <h2>Selected</h2>
    <div id="detail"><span class="hint">Click a step or a fact: what it needs lights up to the left, what it opens to the right. Wheel zooms, drag moves, double click fits.</span></div>
  </aside>
</main>
<div id="tip"></div>
<script>
"use strict";
(function () {
  const params = new URLSearchParams(location.search);
  const src = params.get("data") || "graph-data.js";
  const s = document.createElement("script");
  s.src = src;
  s.onload = () => start(window.CUTAWAY_GRAPH);
  s.onerror = () => { document.getElementById("meta").textContent = "no data at " + src + " (make it with tools/graph.mjs)"; };
  document.head.appendChild(s);

  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const CHAR = 6.6, ROW = 22, STEP_H = 30, GAP_Y = 10, GAP_X = 70;
  const isClock = (f) => /^(time|day)(=|$)/.test(f);
  const slots = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"].map((v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
  const other = getComputedStyle(document.documentElement).getPropertyValue("--other").trim();

  /** @param {any} G */
  function start(G) {
    document.getElementById("meta").textContent =
      `${G.page}${G.act ? " · act " + G.act : ""}${G.set.length ? " · set " + G.set.join(",") : ""} · ${G.states} states${G.complete ? "" : " (search stopped at its limit)"} · ${G.moves.length} steps · ${G.facts.length} facts`;
    // rooms in the order the winning way meets them, then the rest; the first eight get a colour
    const byId = new Map(G.moves.map((m) => [m.id, m]));
    const rooms = [];
    for (const id of G.way) { const r = byId.get(id)?.room; if (r !== undefined && !rooms.includes(r)) rooms.push(r); }
    for (const m of G.moves) if (!rooms.includes(m.room)) rooms.push(m.room);
    // the rooms' colours; what happens anywhere (waiting, the bag) is grey
    const placed = rooms.filter((r) => r !== "");
    const colour = (r) => { const i = placed.indexOf(r); return i >= 0 && i < slots.length ? slots[i] : other; };
    const roomName = (r) => r || "(anywhere)";
    const shown = new Set(rooms);
    const chips = document.getElementById("rooms");
    for (const r of rooms) {
      const b = document.createElement("button");
      b.className = "chip"; b.innerHTML = `<i style="background:${colour(r)}"></i>`; b.append(roomName(r));
      b.onclick = () => { if (shown.has(r)) shown.delete(r); else shown.add(r); b.classList.toggle("off", !shown.has(r)); draw(); };
      chips.appendChild(b);
    }
    const opt = (id) => document.getElementById(id).checked;
    for (const id of ["opt-way", "opt-unused", "opt-neg", "opt-partial", "opt-clock"]) document.getElementById(id).onchange = draw;
    document.getElementById("find").oninput = mark;
    document.getElementById("tab-deps").onclick = () => tab("deps");
    document.getElementById("tab-budget").onclick = () => tab("budget");

    let model = null, selected = null, fitted = false;
    const view = document.getElementById("view"), svg = document.getElementById("svg");
    let zoom = { x: 0, y: 0, k: 1 };
    const applyZoom = () => view.setAttribute("transform", `translate(${zoom.x},${zoom.y}) scale(${zoom.k})`);

    /** What is shown, from the data and the switches: steps merged when what they visibly change is the same. */
    function build() {
      const partial = opt("opt-partial"), neg = opt("opt-neg"), clock = opt("opt-clock"), unused = opt("opt-unused");
      const reads = (m) => m.reads.filter(([f, s]) => (partial || s >= 1) && (clock || !isClock(f)));
      const absent = (m) => (neg ? m.neg.filter(([f, s]) => (partial || s >= 1) && (clock || !isClock(f))) : []);
      const cand = G.moves.filter((m) => shown.has(m.room));
      const needed = new Set();
      for (const m of cand) { for (const [f] of reads(m)) needed.add(f); for (const [f] of absent(m)) needed.add(f); }
      const keep = (f) => { const b = f.replace(/^!/, ""); return (clock || !isClock(b)) && (unused || needed.has(b)); };
      /** @type {Map<string, any>} */
      const steps = new Map(), rename = new Map();
      for (const m of cand) {
        const writes = m.writes.filter(keep), brings = writes.filter((w) => !w.startsWith("!"));
        // one step per move and what it brings about that is needed: variants that differ in what nothing needs,
        // or only in what they take away (a switch turned back on the way), are one
        const id = `${m.room}|${m.move}|${brings.join(",")}`;
        rename.set(m.id, id);
        let st = steps.get(id);
        if (!st) steps.set(id, (st = { id, kind: "step", room: m.room, move: m.move, writes: [], n: 0, wins: 0, cnt: new Map(), ncnt: new Map(), variants: [] }));
        st.n += m.n; st.wins += m.wins; st.variants.push(m);
        for (const w of writes) if (!st.writes.includes(w)) st.writes.push(w);
        for (const [f, sh] of reads(m)) st.cnt.set(f, (st.cnt.get(f) ?? 0) + sh * m.n);
        for (const [f, sh] of absent(m)) st.ncnt.set(f, (st.ncnt.get(f) ?? 0) + sh * m.n);
      }
      for (const st of steps.values()) {
        st.reads = [...st.cnt].map(([f, c]) => [f, c / st.n]).filter(([, sh]) => partial || sh >= 0.999).sort();
        st.neg = [...st.ncnt].map(([f, c]) => [f, c / st.n]).filter(([, sh]) => partial || sh >= 0.999).sort();
        st.writes.sort();
        // shown: what brings about something needed, what is held back by a condition (a door that needs a key), the end
        if (!st.writes.some((w) => !w.startsWith("!")) && !st.reads.length && !st.neg.length && !st.wins) steps.delete(st.id);
      }
      const way = [];
      for (const id of G.way) { const r = rename.get(id); if (r && steps.has(r) && !way.includes(r)) way.push(r); }
      // only what the way needs: the way's steps and everything upstream of them
      if (opt("opt-way")) {
        const by = new Map();
        for (const st of steps.values()) for (const f of st.writes) { const b = f.replace(/^!/, ""); if (!by.has(b)) by.set(b, []); by.get(b).push(st.id); }
        const want = new Set(way), todo = [...way];
        while (todo.length) {
          const st = steps.get(todo.pop());
          for (const [f] of [...st.reads, ...st.neg]) for (const p of by.get(f) ?? []) if (!want.has(p)) { want.add(p); todo.push(p); }
        }
        for (const id of [...steps.keys()]) if (!want.has(id)) steps.delete(id);
      }
      /** @type {Map<string, any>} */
      const facts = new Map();
      const fact = (f) => { let x = facts.get(f); if (!x) facts.set(f, (x = { id: "f:" + f, name: f, kind: "fact", by: [], needs: [], unless: [] })); return x; };
      const edges = [];
      for (const st of steps.values()) {
        for (const [f, sh] of st.reads) { fact(f).needs.push(st.id); edges.push({ from: "f:" + f, to: st.id, type: "needs", share: sh }); }
        for (const [f, sh] of st.neg) { fact(f).unless.push(st.id); edges.push({ from: "f:" + f, to: st.id, type: "unless", share: sh }); }
        for (const w of st.writes) { const b = w.replace(/^!/, ""); fact(b).by.push(st.id); edges.push({ from: st.id, to: "f:" + b, type: w.startsWith("!") ? "clears" : "brings" }); }
      }
      const nodes = new Map([...steps.values(), ...facts.values()].map((n) => [n.id, n]));
      return { nodes, edges, way };
    }

    function draw() {
      model = build();
      for (const n of model.nodes.values()) {
        if (n.kind === "step") { n.w = Math.max(roomName(n.room).length * 5.6, n.move.length * CHAR) + 22; n.h = STEP_H; }
        else { n.w = n.name.length * CHAR + 18; n.h = ROW; }
      }
      // absence and clearing don't order the steps (they would make loops): only needs and brings lay them out
      layout([...model.nodes.values()], model.edges.filter((e) => e.type === "needs" || e.type === "brings"));
      render();
      if (!fitted) { fit(); fitted = true; }
      if (selected && !model.nodes.has(selected)) selected = null;
      select(selected);
    }

    // ---- a layered layout (Sugiyama): break loops, layer by longest path, long edges through dummies,
    // order the layers by barycentres (keeping the order with the fewest crossings), then place
    function layout(nodes, edges) {
      const ids = nodes.map((n) => n.id), idx = new Map(ids.map((id, i) => [id, i]));
      let E = edges.filter((e) => idx.has(e.from) && idx.has(e.to)).map((e) => ({ e, u: idx.get(e.from), v: idx.get(e.to), rev: false }));
      const out = ids.map(() => []);
      E.forEach((x, i) => out[x.u].push(i));
      // loops: depth-first, an edge back to a node on the stack is turned round
      const state = new Uint8Array(ids.length);
      for (let r = 0; r < ids.length; r++) {
        if (state[r]) continue;
        const stack = [[r, 0]]; state[r] = 1;
        while (stack.length) {
          const top = stack[stack.length - 1], [u, k] = top;
          if (k < out[u].length) {
            top[1]++;
            const x = E[out[u][k]], v = x.v;
            if (state[v] === 1) x.rev = true;
            else if (!state[v]) { state[v] = 1; stack.push([v, 0]); }
          } else { state[u] = 2; stack.pop(); }
        }
      }
      const pairs = E.map((x) => (x.rev ? [x.v, x.u] : [x.u, x.v]));
      const preds = ids.map(() => []), succs = ids.map(() => []);
      pairs.forEach(([a, b]) => { if (a !== b) { succs[a].push(b); preds[b].push(a); } });
      // longest path from the sources
      const layer = new Int32Array(ids.length), indeg = preds.map((p) => p.length), q = [];
      indeg.forEach((d, i) => { if (!d) q.push(i); });
      const topo = [];
      while (q.length) { const u = q.shift(); topo.push(u); for (const v of succs[u]) { layer[v] = Math.max(layer[v], layer[u] + 1); if (!--indeg[v]) q.push(v); } }
      // what nothing brings about (a fact from the start) sits just before its first use, not at the far left
      for (const u of topo.slice().reverse()) if (!preds[u].length && succs[u].length) layer[u] = Math.max(0, Math.min(...succs[u].map((v) => layer[v])) - 1);
      // long edges through dummies, one per layer crossed
      const L = Math.max(0, ...layer) + 1;
      const all = ids.map((id, i) => ({ id, i, layer: layer[i], w: nodes[i].w, h: nodes[i].h, dummy: false }));
      const up = all.map(() => []), down = all.map(() => []);
      const chains = [];
      pairs.forEach(([a, b], k) => {
        if (a === b) { chains.push([a]); return; }
        const chain = [a];
        let prev = a;
        for (let l = layer[a] + 1; l < layer[b]; l++) {
          const d = all.length;
          all.push({ id: "~" + d, i: d, layer: l, w: 0, h: 6, dummy: true }); up.push([]); down.push([]);
          down[prev].push(d); up[d].push(prev); chain.push(d); prev = d;
        }
        down[prev].push(b); up[b].push(prev); chain.push(b);
        chains.push(chain);
      });
      const layers = Array.from({ length: L }, () => []);
      for (const u of topo) layers[layer[u]].push(u);
      for (const n of all) if (n.dummy) layers[n.layer].push(n.i);
      const pos = new Float64Array(all.length);
      const index = () => layers.forEach((l) => l.forEach((u, j) => { pos[u] = j; }));
      index();
      const crossings = () => {
        let c = 0;
        for (let l = 0; l + 1 < L; l++) {
          const segs = [];
          for (const u of layers[l]) for (const v of down[u]) segs.push([pos[u], pos[v]]);
          for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) if ((segs[i][0] - segs[j][0]) * (segs[i][1] - segs[j][1]) < 0) c++;
        }
        return c;
      };
      let best = layers.map((l) => l.slice()), bestC = crossings();
      for (let it = 0; it < 24; it++) {
        const downward = it % 2 === 0;
        const order = downward ? [...layers.keys()].slice(1) : [...layers.keys()].reverse().slice(1);
        for (const l of order) {
          const nb = downward ? up : down;
          const key = new Map(layers[l].map((u) => { const ns = nb[u]; return [u, ns.length ? ns.reduce((s, v) => s + pos[v], 0) / ns.length : pos[u]]; }));
          layers[l].sort((a, b) => key.get(a) - key.get(b));
          layers[l].forEach((u, j) => { pos[u] = j; });
        }
        const c = crossings();
        if (c < bestC) { bestC = c; best = layers.map((x) => x.slice()); }
      }
      best.forEach((l, i) => { layers[i] = l; });
      index();
      // x: columns as wide as their widest node; y: stacked, then drawn towards their neighbours
      const colX = [];
      let x = 0;
      for (let l = 0; l < L; l++) { colX.push(x); x += Math.max(20, ...layers[l].map((u) => all[u].w)) + GAP_X; }
      // y: each layer centred, then drawn towards its neighbours: per layer the placement nearest to where
      // each node wants to be that keeps the order and the gaps (isotonic regression, pool adjacent
      // violators), so nothing drifts the way pushing one way would
      const y = new Float64Array(all.length);
      for (const l of layers) { const tot = l.reduce((s2, u) => s2 + all[u].h + GAP_Y, -GAP_Y); let yy = -tot / 2; for (const u of l) { y[u] = yy; yy += all[u].h + GAP_Y; } }
      const centre = (u) => y[u] + all[u].h / 2;
      const place = (l, want) => {
        const off = [];
        let acc = 0;
        for (const u of l) { off.push(acc); acc += all[u].h + GAP_Y; }
        const blocks = [];                                 // [sum, count, first index]
        l.forEach((u, j) => {
          blocks.push([want[j] - off[j], 1, j]);
          while (blocks.length > 1 && blocks[blocks.length - 2][0] / blocks[blocks.length - 2][1] > blocks[blocks.length - 1][0] / blocks[blocks.length - 1][1]) {
            const b2 = blocks.pop(), b1 = blocks[blocks.length - 1];
            b1[0] += b2[0]; b1[1] += b2[1];
          }
        });
        for (let b = 0; b < blocks.length; b++) {
          const v = blocks[b][0] / blocks[b][1], end2 = b + 1 < blocks.length ? blocks[b + 1][2] : l.length;
          for (let j = blocks[b][2]; j < end2; j++) y[l[j]] = v + off[j];
        }
      };
      for (let it = 0; it < 16; it++) {
        const order = it % 2 ? layers.slice().reverse() : layers;
        for (const l of order) {
          const want = l.map((u) => {
            const ns = it % 4 < 2 ? (it % 2 ? down[u] : up[u]) : [...up[u], ...down[u]];
            return ns.length ? ns.reduce((s2, v) => s2 + centre(v), 0) / ns.length - all[u].h / 2 : y[u];
          });
          place(l, want);
        }
      }
      const minY = Math.min(...y);
      all.forEach((n, i) => { n.x = colX[n.layer] + (n.dummy ? 0 : 0); n.y = y[i] - minY; n.colW = Math.max(20, ...layers[n.layer].map((u) => all[u].w)); });
      nodes.forEach((n, i) => { n.x = all[i].x; n.y = all[i].y; n.layer = all[i].layer; });
      // each edge's points: out of its source's right side, through its dummies, into its target's left side
      E.forEach((x, k) => {
        const chain = x.rev ? chains[k].slice().reverse() : chains[k];
        x.e.points = chain.map((u, j) => {
          const n = all[u];
          if (n.dummy) return [n.x + n.colW / 2, n.y + 3];
          const right = j === 0 ? !x.rev : x.rev;
          return [n.x + (right ? n.w : 0), n.y + n.h / 2];
        });
      });
    }

    function curve(pts) {
      let d = `M${pts[0][0]},${pts[0][1]}`;
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], dx = Math.max(20, Math.abs(x1 - x0) / 2) * Math.sign(x1 - x0 || 1);
        d += ` C${x0 + dx},${y0} ${x1 - dx},${y1} ${x1},${y1}`;
      }
      return d;
    }

    function render() {
      view.textContent = "";
      const ge = el("g", {}, view), gn = el("g", {}, view);
      const wayNo = new Map(model.way.map((id, i) => [id, i + 1]));
      for (const e of model.edges) {
        if (!e.points) {   // absence: drawn straight, as it doesn't take part in the layout
          const a = model.nodes.get(e.from), b = model.nodes.get(e.to);
          e.points = [[a.x + a.w, a.y + a.h / 2], [b.x, b.y + b.h / 2]];
        }
        const from = model.nodes.get(e.from);
        const stroke = e.type === "unless" || e.type === "clears" ? getComputedStyle(document.documentElement).getPropertyValue("--critical")
          : e.type === "brings" ? colour(from.room) : "#8a897f";
        e.el = el("path", { class: "edge", d: curve(e.points), stroke, "marker-end": "url(#arrow)",
          "stroke-dasharray": e.type === "unless" ? "3 3" : e.share !== undefined && e.share < 0.999 ? "6 4" : "", opacity: e.type === "brings" ? 0.9 : 0.7 }, ge);
      }
      for (const n of model.nodes.values()) {
        const g = el("g", { class: "node", transform: `translate(${n.x},${n.y})` }, gn);
        n.el = g;
        if (n.kind === "step") {
          const onWay = wayNo.has(n.id);
          el("rect", { width: n.w, height: n.h, rx: 4, fill: "#242422", stroke: onWay ? "#f0efec" : "#383835", "stroke-width": onWay ? 1.6 : 1 }, g);
          el("rect", { width: 5, height: n.h, rx: 2, fill: colour(n.room) }, g);
          if (n.wins) el("rect", { x: -3, y: -3, width: n.w + 6, height: n.h + 6, rx: 6, fill: "none", stroke: "#f0efec", "stroke-width": 1 }, g);
          el("text", { x: 11, y: 11, class: "room" }, g).textContent = roomName(n.room);
          el("text", { x: 11, y: 24 }, g).textContent = n.move;
          if (onWay) {
            const no = String(wayNo.get(n.id)), bw = no.length * 6 + 8;
            el("rect", { x: n.w - bw + 4, y: -8, width: bw, height: 14, rx: 7, fill: "#f0efec" }, g);
            const t = el("text", { x: n.w - bw / 2 + 4, y: 3, "text-anchor": "middle" }, g);
            t.textContent = no; t.style.fill = "#121211"; t.style.fontSize = "10px";
          }
        } else {
          el("rect", { width: n.w, height: n.h, rx: n.h / 2, fill: "#1a1a19", stroke: n.by.length ? "#8a897f" : "#5a5953", "stroke-dasharray": n.by.length ? "" : "3 2" }, g);
          el("text", { x: 9, y: 15 }, g).textContent = n.name;
        }
        g.onclick = (ev) => { ev.stopPropagation(); select(n.id); };
        g.onmouseenter = (ev) => tip(n, ev);
        g.onmousemove = (ev) => tip(n, ev);
        g.onmouseleave = () => tip(null);
      }
      mark();
    }

    const tipEl = document.getElementById("tip");
    function tip(n, ev) {
      if (!n) { tipEl.style.display = "none"; return; }
      tipEl.textContent = n.kind === "step"
        ? `${roomName(n.room)}: ${n.move} · played ${n.n}×${n.wins ? " · ends the act" : ""}${n.variants.length > 1 ? ` · ${n.variants.length} variants` : ""}`
        : `${n.name} · brought about by ${n.by.length} · needed by ${n.needs.length}${n.by.length ? "" : " · from the start"}`;
      tipEl.style.display = "block";
      tipEl.style.left = ev.clientX + 14 + "px"; tipEl.style.top = ev.clientY + 12 + "px";
    }

    /** Light up a node, what it needs (to the left) and what it opens (to the right); the rest dims. */
    function select(id) {
      selected = id;
      const detail = document.getElementById("detail");
      if (!id) {
        for (const n of model.nodes.values()) n.el.classList.remove("dim");
        for (const e of model.edges) e.el.classList.remove("dim");
        detail.innerHTML = '<span class="hint">Click a step or a fact: what it needs lights up to the left, what it opens to the right. Wheel zooms, drag moves, double click fits.</span>';
        return;
      }
      const lit = new Set([id]), litE = new Set();
      const walk = (start, forward) => {
        const todo = [start];
        while (todo.length) {
          const u = todo.pop();
          for (const e of model.edges) {
            if (e.type === "unless" || e.type === "clears") { if ((forward ? e.from : e.to) === u) litE.add(e); continue; }
            const [a, b] = forward ? [e.from, e.to] : [e.to, e.from];
            if (a !== u) continue;
            litE.add(e);
            if (!lit.has(b)) { lit.add(b); todo.push(b); }
          }
        }
      };
      walk(id, false); walk(id, true);
      for (const n of model.nodes.values()) n.el.classList.toggle("dim", !lit.has(n.id));
      for (const e of model.edges) e.el.classList.toggle("dim", !litE.has(e));
      const n = model.nodes.get(id);
      detail.textContent = "";
      const h = (t) => { const p = document.createElement("div"); p.className = "k"; p.textContent = t; detail.appendChild(p); };
      const list = (items) => {
        const ul = document.createElement("ul");
        for (const [label, target, share] of items) {
          const li = document.createElement("li");
          li.textContent = label;
          if (share !== undefined && share < 0.999) { const s = document.createElement("span"); s.className = "share"; s.textContent = ` ${Math.round(share * 100)}%`; li.appendChild(s); }
          li.onclick = () => { select(target); focus(target); };
          ul.appendChild(li);
        }
        if (!items.length) { const li = document.createElement("li"); li.textContent = "—"; li.style.cursor = "default"; ul.appendChild(li); }
        detail.appendChild(ul);
      };
      const stepLabel = (sid) => { const s2 = model.nodes.get(sid); return `${roomName(s2.room)}: ${s2.move}`; };
      const t = document.createElement("div");
      t.style.fontWeight = "600"; t.style.marginBottom = "6px";
      if (n.kind === "step") {
        t.textContent = `${roomName(n.room)}: ${n.move}`;
        detail.appendChild(t);
        h(`played ${n.n}× in the search${n.wins ? ", ends the act" : ""}${n.variants.length > 1 ? `; ${n.variants.length} variants merged (they differ only in what nothing needs)` : ""}`);
        h("needs"); list(n.reads.map(([f, sh]) => [f, "f:" + f, sh]));
        if (n.neg.length) { h("only while not"); list(n.neg.map(([f, sh]) => [f, "f:" + f, sh])); }
        h("brings about"); list(n.writes.map((w) => [w, "f:" + w.replace(/^!/, "")]));
      } else {
        t.textContent = n.name;
        detail.appendChild(t);
        h("brought about by"); list(n.by.map((sid) => [stepLabel(sid), sid]));
        h("needed by"); list(n.needs.map((sid) => [stepLabel(sid), sid]));
        if (n.unless.length) { h("stops"); list(n.unless.map((sid) => [stepLabel(sid), sid])); }
      }
    }

    /** The search: matching nodes get an accent outline. */
    function mark() {
      const q = document.getElementById("find").value.trim().toLowerCase();
      for (const n of model?.nodes.values() ?? []) {
        const hit = q && (n.kind === "step" ? `${n.room} ${n.move}` : n.name).toLowerCase().includes(q);
        n.el.querySelector("rect").setAttribute("stroke", hit ? "#3987e5" : n.kind === "step" ? (model.way.includes(n.id) ? "#f0efec" : "#383835") : n.by.length ? "#8a897f" : "#5a5953");
        n.el.querySelector("rect").setAttribute("stroke-width", hit ? 2.5 : n.kind === "step" && model.way.includes(n.id) ? 1.6 : 1);
      }
    }

    /** Bring a node to the middle, readable (scale k). @param {string} id @param {number} [k] */
    function focus(id, k = Math.max(zoom.k, 1)) {
      const n = model.nodes.get(id), r = svg.getBoundingClientRect();
      if (!n) return;
      zoom.k = k; zoom.x = r.width / 2 - (n.x + n.w / 2) * k; zoom.y = r.height / 2 - (n.y + n.h / 2) * k;
      applyZoom();
    }

    function fit() {
      const b = view.getBBox(), r = svg.getBoundingClientRect();
      if (!b.width) return;
      zoom.k = Math.min(r.width / (b.width + 40), r.height / (b.height + 40), 1.5);
      zoom.x = (r.width - b.width * zoom.k) / 2 - b.x * zoom.k;
      zoom.y = (r.height - b.height * zoom.k) / 2 - b.y * zoom.k;
      applyZoom();
    }
    const canvas = document.getElementById("canvas");
    canvas.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top, f = Math.exp(-ev.deltaY * 0.0015);
      zoom.x = mx - (mx - zoom.x) * f; zoom.y = my - (my - zoom.y) * f; zoom.k *= f;
      applyZoom();
    }, { passive: false });
    let drag = null;
    canvas.addEventListener("mousedown", (ev) => { drag = { x: ev.clientX, y: ev.clientY, zx: zoom.x, zy: zoom.y, moved: false }; canvas.classList.add("drag"); });
    addEventListener("mousemove", (ev) => {
      if (!drag) return;
      if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 3) drag.moved = true;
      zoom.x = drag.zx + ev.clientX - drag.x; zoom.y = drag.zy + ev.clientY - drag.y; applyZoom();
    });
    addEventListener("mouseup", () => { canvas.classList.remove("drag"); setTimeout(() => { drag = null; }, 0); });
    canvas.addEventListener("click", () => { if (!drag?.moved) select(null); });
    canvas.addEventListener("dblclick", fit);

    // ---- the state budget: how many times more states each part makes, on a log scale (×2 is one step)
    function budget() {
      const box = document.createElement("div");
      box.id = "budget";
      const list = G.factors;
      const p = document.createElement("p");
      p.textContent = `${G.states} states. Each bar says how many times more states there are because of this part of the state: ` +
        `left out, the search would find that many times fewer. ×2: it doubles them (a flag nobody asks about, set or not at any time); ` +
        `×1: it follows from the rest. Parts are flags, items carried (has:), object states (obj:), once-marks (once:, ~dlg.), visited rooms and where actors are (at:).`;
      box.appendChild(p);
      const max = Math.max(1, ...list.map((f) => Math.log2(f.factor)));
      const ticks = [];
      for (let t = 0; t <= Math.ceil(max); t++) ticks.push(t);
      const scale = Math.ceil(max) || 1;
      for (const f of list) {
        const row = document.createElement("div");
        row.className = "row";
        row.title = `${f.part}: ×${f.factor} (${f.values} values seen)`;
        const name = document.createElement("div"); name.className = "name"; name.textContent = f.part;
        const track = document.createElement("div"); track.className = "track";
        for (const t of ticks) { const gl = document.createElement("div"); gl.className = "grid"; gl.style.left = (t / scale) * 90 + "%"; track.appendChild(gl); }
        const bar = document.createElement("div"); bar.className = "bar";
        const w = (Math.log2(f.factor) / scale) * 90;
        bar.style.width = `max(2px, ${w}%)`;
        const val = document.createElement("div"); val.className = "val"; val.style.left = `calc(${w}% + 6px)`;
        val.textContent = `×${f.factor.toFixed(2)} · ${f.values} values`;
        track.append(bar, val);
        row.append(name, track);
        box.appendChild(row);
      }
      const axis = document.createElement("div"); axis.className = "axis";
      const ax = document.createElement("div");
      for (const t of ticks) { const s2 = document.createElement("span"); s2.style.left = (t / scale) * 90 + "%"; s2.textContent = "×" + 2 ** t; ax.appendChild(s2); }
      axis.append(document.createElement("i"), ax);     // the names' column stays empty
      box.appendChild(axis);
      if (!list.length) box.appendChild(Object.assign(document.createElement("p"), { textContent: "Nothing multiplies the states." }));
      return box;
    }
    let budgetEl = null;
    function tab(which) {
      document.getElementById("tab-deps").classList.toggle("on", which === "deps");
      document.getElementById("tab-budget").classList.toggle("on", which === "budget");
      const main = document.getElementById("main");
      main.classList.toggle("budget", which === "budget");
      canvas.style.display = document.getElementById("side").style.display = which === "deps" ? "" : "none";
      if (which === "budget") { if (!budgetEl) { budgetEl = budget(); main.appendChild(budgetEl); } budgetEl.style.display = ""; }
      else if (budgetEl) budgetEl.style.display = "none";
      if (which === "deps" && !fitted) draw();
    }
    window.cutawayGraph = { select, focus, tab, fit, model: () => model };
    tab(params.get("tab") === "budget" ? "budget" : "deps");
    draw();
  }
})();
</script>
</body>
</html>
