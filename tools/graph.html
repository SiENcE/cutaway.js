<!doctype html>
<!-- The game's connections (tools/graph.mjs writes the data), a page of its own: the chart and the state budget
     drawn by the engine's graph-view.js (the editor's Connections tab draws the same). Opens from file://:
     graph.html?data=<the data file's URL> (default graph-data.js beside it); &tab=budget opens the budget. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cutaway: connections</title>
<style>
  html, body { margin: 0; height: 100%; background: #121211; color: #f0efec; font: 13px/1.4 system-ui, sans-serif; color-scheme: dark; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 14px; background: #1a1a19; border-bottom: 1px solid #383835; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .meta { color: #c3c2b7; }
  .tabs { display: flex; gap: 2px; margin-left: auto; }
  .tabs button { background: none; border: 1px solid #383835; color: #c3c2b7; padding: 4px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
  .tabs button.on { background: #242422; color: #f0efec; border-color: #8a897f; }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  main.budget { grid-template-columns: 1fr; }
  #canvas, #budget { min-height: 0; }
  aside { border-left: 1px solid #383835; background: #1a1a19; overflow: auto; padding: 10px 14px; }
</style>
</head>
<body>
<header>
  <h1>Connections</h1><span class="meta" id="meta">loading…</span>
  <div class="tabs"><button id="tab-deps" class="on">Dependencies</button><button id="tab-budget">State budget</button></div>
</header>
<main id="main"><div id="canvas"></div><aside id="side"></aside><div id="budget" style="display: none"></div></main>
<script>
"use strict";
// graph-view.js adds itself to the engine's namespace; this page has no engine, so the namespace starts here
var Cutaway = window.Cutaway || {};
(function () {
  const params = new URLSearchParams(location.search), src = params.get("data") || "graph-data.js";
  const meta = document.getElementById("meta");
  /** Load a script, else the next of a list. @param {string[]} srcs */
  const load = (srcs) => new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = srcs[0];
    s.onload = ok;
    s.onerror = () => (srcs.length > 1 ? load(srcs.slice(1)).then(ok, fail) : fail(new Error("no " + srcs[0])));
    document.head.append(s);
  });
  // the view sits in the engine's src/ (the engine's own repo) or beside the tools' folder (a game's copy in lib/cutaway/)
  load(["../src/graph-view.js", "../graph-view.js"])
    .then(() => load([src]).catch(() => { throw new Error("no data at " + src + " (make it with tools/graph.mjs)"); }))
    .then(() => start(window.CUTAWAY_GRAPH))
    .catch((e) => { meta.textContent = e.message; });

  function start(G) {
    const side = document.getElementById("side"), canvas = document.getElementById("canvas"), budgetBox = document.getElementById("budget");
    const g = Cutaway.graphView.create(G, { onChange: () => { side.textContent = ""; g.side(side); } });
    meta.textContent = g.about();
    canvas.append(g.chart);
    g.side(side);
    g.shown();
    let budget = null;
    const tab = (which) => {
      document.getElementById("tab-deps").classList.toggle("on", which === "deps");
      document.getElementById("tab-budget").classList.toggle("on", which === "budget");
      document.getElementById("main").classList.toggle("budget", which === "budget");
      canvas.style.display = side.style.display = which === "deps" ? "" : "none";
      budgetBox.style.display = which === "budget" ? "" : "none";
      if (which === "budget" && !budget) { budget = g.budget(); budgetBox.append(budget); }
      if (which === "deps") g.shown();
    };
    document.getElementById("tab-deps").onclick = () => tab("deps");
    document.getElementById("tab-budget").onclick = () => tab("budget");
    tab(params.get("tab") === "budget" ? "budget" : "deps");
    window.cutawayGraph = { view: g, tab };
  }
})();
</script>
</body>
</html>
